name: Deploy Documentation WIF
run-name: "Deploy Documentation (${{ github.event_name == 'workflow_dispatch' && format('PR #{0}', inputs.pr_number) || github.ref_name }})"

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "app/**"
      - "components/**"
      - "content/**"
      - "lib/**"
      - "public/**"
      - "scripts/**"
      - ".dockerignore"
      - "Dockerfile"
      - "eslint.config.mjs"
      - "next.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "postcss.config.mjs"
      - "proxy.ts"
      - "source.config.ts"
      - "tsconfig.json"
      - ".github/workflows/gcp_docs_wif.yml"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to verify and deploy to dev
        required: true
        type: string

concurrency:
  group: deploy-docs-wif-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  prepare:
    name: Resolve deployment source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source_sha: ${{ steps.push-source.outputs.source_sha || steps.pr-source.outputs.source_sha }}
      pr_number: ${{ steps.pr-source.outputs.pr_number }}
    steps:
      - name: Use pushed commit
        id: push-source
        if: github.event_name == 'push'
        shell: bash
        run: echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Validate pull request and resolve commit
        id: pr-source
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const rawPrNumber = process.env.PR_NUMBER ?? '';

            if (context.actor !== 'ajoshi31') {
              throw new Error('Only ajoshi31 may manually deploy a pull request.');
            }

            if (context.ref !== 'refs/heads/dev') {
              throw new Error('Manual deployments must use the workflow from dev.');
            }

            if (!/^[1-9][0-9]*$/.test(rawPrNumber)) {
              throw new Error('pr_number must be a positive integer.');
            }

            const prNumber = Number(rawPrNumber);
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pullRequest.state !== 'open') {
              throw new Error(`PR #${prNumber} is not open.`);
            }

            if (pullRequest.draft) {
              throw new Error(`PR #${prNumber} is still a draft.`);
            }

            if (pullRequest.head.repo?.full_name !== context.payload.repository.full_name) {
              throw new Error('Only pull requests from this repository may be deployed.');
            }

            if (!/^[0-9a-f]{40}$/i.test(pullRequest.head.sha)) {
              throw new Error(`PR #${prNumber} did not resolve to a full commit SHA.`);
            }

            core.setOutput('source_sha', pullRequest.head.sha);
            core.setOutput('pr_number', String(prNumber));

            await core.summary
              .addHeading(`Deploy PR #${prNumber}`)
              .addTable([
                [{ data: 'Field', header: true }, { data: 'Value', header: true }],
                ['PR', `#${prNumber}: ${pullRequest.title}`],
                ['Source branch', pullRequest.head.ref],
                ['Base branch', pullRequest.base.ref],
                ['Source SHA', pullRequest.head.sha],
              ])
              .addLink('Open pull request', pullRequest.html_url)
              .write();

  verify:
    name: Verify PR code
    if: github.event_name == 'workflow_dispatch' && needs.prepare.result == 'success'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout verified PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm types:check

      - name: Build
        run: pnpm build

  deploy:
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (github.event_name == 'push' || needs.verify.result == 'success')
    needs:
      - prepare
      - verify
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GAR_NAME: frontend-services
      GAR_LOCATION: ${{ vars.GCP_REGION }}
      GAR_SERVICE: docs
      SERVICE: docs
      REGION: ${{ vars.GCP_REGION }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      SOURCE_PR: ${{ needs.prepare.outputs.pr_number || 'push' }}
    steps:
      - name: Validate runtime configuration
        shell: bash
        env:
          DOCS_ENV_SECRET: ${{ secrets.DOCS_ENV_SECRET }}
          NEXT_PUBLIC_DOCUMENTATION_URL: ${{ secrets.NEXT_PUBLIC_DOCUMENTATION_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$DOCS_ENV_SECRET" ]]; then
            echo "DOCS_ENV_SECRET is not configured for the selected environment." >&2
            exit 1
          fi
          if [[ -z "$NEXT_PUBLIC_DOCUMENTATION_URL" ]]; then
            echo "NEXT_PUBLIC_DOCUMENTATION_URL is not configured for the selected environment." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve image coordinates
        id: image
        shell: bash
        run: |
          set -euo pipefail
          project_id="$(printf '%s' '${{ env.PROJECT_ID }}' | tr -d '\r\n')"
          gar_location="$(printf '%s' '${{ env.GAR_LOCATION }}' | tr -d '\r\n')"
          gar_name="$(printf '%s' '${{ env.GAR_NAME }}' | tr -d '\r\n')"
          gar_service="$(printf '%s' '${{ env.GAR_SERVICE }}' | tr -d '\r\n')"
          image_ref="${gar_location}-docker.pkg.dev/${project_id}/${gar_name}/${gar_service}:${SOURCE_SHA}"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Build container without cloud credentials or secrets
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ steps.image.outputs.image_ref }}
          load: true
          push: false
          build-args: |
            NEXT_PUBLIC_DOCUMENTATION_URL=${{ secrets.NEXT_PUBLIC_DOCUMENTATION_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Docker Auth
        run: gcloud auth configure-docker "${{ env.GAR_LOCATION }}-docker.pkg.dev"

      - name: Push container
        run: docker push "${{ steps.image.outputs.image_ref }}"

      - name: Resolve image digest
        id: image-digest
        shell: bash
        run: |
          set -euo pipefail
          image_ref="$(printf '%s' '${{ steps.image.outputs.image_ref }}' | tr -d '\r\n')"
          image_digest="$(gcloud artifacts docker images describe "$image_ref" --format='value(image_summary.fully_qualified_digest)')"

          if [[ -z "$image_digest" ]]; then
            echo "Unable to resolve image digest for $image_ref" >&2
            exit 1
          fi

          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ steps.image-digest.outputs.image_digest }}
          labels: |-
            source-sha=${{ env.SOURCE_SHA }}
            source-pr=${{ env.SOURCE_PR }}
          env_vars: ${{ secrets.DOCS_ENV_SECRET }}
          env_vars_update_strategy: overwrite

      - name: Show Output
        run: echo "${{ steps.deploy.outputs.url }}"
