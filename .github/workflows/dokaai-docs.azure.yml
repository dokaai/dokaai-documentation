name: Deploy Documentation Azure

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "app/**"
      - "components/**"
      - "content/**"
      - "lib/**"
      - "public/**"
      - "scripts/**"
      - "api/**"
      - "Dockerfile"
      - "eslint.config.mjs"
      - "next.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "postcss.config.mjs"
      - "proxy.ts"
      - "source.config.ts"
      - "tsconfig.json"
      - ".github/workflows/dokaai-docs.azure.yml"
  workflow_dispatch:

concurrency:
  group: deploy-docs-azure-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    runs-on: ubuntu-latest
    env:
      AZURE_CONTAINER_REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
      AZURE_CONTAINER_REGISTRY_LOGIN_SERVER: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME || 'docs' }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      IMAGE_REPOSITORY: ${{ vars.AZURE_IMAGE_REPOSITORY || 'frontend-services/docs' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Enable Azure CLI extensions
        run: az config set extension.use_dynamic_install=yes_without_prompt

      - name: ACR Login
        run: az acr login --name "${{ env.AZURE_CONTAINER_REGISTRY_NAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image coordinates
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${{ env.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Check existing SHA image
        id: check-image
        shell: bash
        run: |
          set -euo pipefail
          repository="${{ env.IMAGE_REPOSITORY }}"
          tag="${{ github.sha }}"

          if az acr repository show-tags \
            --name "${{ env.AZURE_CONTAINER_REGISTRY_NAME }}" \
            --repository "$repository" \
            --query "[?@=='$tag'] | length(@)" \
            --output tsv | grep -qx '1'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists for $tag. Skipping rebuild."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image does not exist for $tag. Build and push required."
          fi

      - name: Write build env file
        if: steps.check-image.outputs.exists != 'true'
        shell: bash
        env:
          WEB_APP_ENV_SECRET: ${{ secrets.WEB_APP_ENV_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$WEB_APP_ENV_SECRET" > .env.production

      - name: Build and Push Container
        if: steps.check-image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ steps.image.outputs.image_ref }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Azure Container Apps
        shell: bash
        run: |
          set -euo pipefail
          az containerapp update \
            --name "${{ env.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.image.outputs.image_ref }}"

      - name: Show Output
        shell: bash
        run: |
          set -euo pipefail
          az containerapp show \
            --name "${{ env.AZURE_CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv
